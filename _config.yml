####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed

# jekyll-sitemap ships with the pinned github-pages gem (Gemfile.lock), but is not one of the
# plugins GitHub Pages enables on its own — without this line there is no /sitemap.xml at all,
# and nothing to hand Search Console. It reads `url` above, so it moves with the domain.
plugins:
  - jekyll-sitemap

# Exclude these files from your production _site
exclude:
  - LICENSE
  - README.md
  - CNAME

# Jekyll drops every dot-prefixed path from _site by default, so .well-known/ would never
# be built. Listing it here is what puts the app-ownership proof on the live domain.
include:
  - .well-known

collections:
  pages:
    output: true
    permalink: /:path/

# Markdown rendering
markdown: kramdown
