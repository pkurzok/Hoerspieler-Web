# Feature List                            Edit, add or remove features to be presented.
#                                         Order matters: the first rows are the ones a parent reads.
#                                         Icons must exist in Font Awesome 5.6.3 Free (see _includes/head.html).
#                                         Written as benefits: the title says what a family gets, the
#                                         description names the feature that delivers it. Say "mit Pro"
#                                         wherever a benefit depends on it (CarPlay, the offline view).
#                                         No ": " or " #" inside a value — YAML would split or truncate it.
features                                  :

  - title                                 : Ruhe auf der Rückbank
    description                           : Kein Netz im Auto? Was über Apple Music aufs Gerät geladen ist, zeigt und spielt Hörspieler trotzdem — und Favoriten und zuletzt Gehörtes stehen direkt auf dem CarPlay-Display. Offline-Ansicht und CarPlay gibt es mit Pro.
    fontawesome_icon_name                 : car

  - title                                 : Einschlafen, ohne dass jemand aufstehen muss
    description                           : Der Einschlaf-Timer hält das Hörspiel nach fünf Minuten bis zu einer Stunde an — oder genau am Ende der Folge.
    fontawesome_icon_name                 : moon

  - title                                 : Du bestimmst, wie lange gehört wird
    description                           : Lege ein Tages- oder Wochenlimit fest, geschützt mit deinem PIN. Für lange Fahrten gibt es „noch 10 Minuten“ oder „heute ohne Limit“. Ohne Aufpreis, und gezählt wird nur auf dem Gerät.
    fontawesome_icon_name                 : hourglass-half

  - title                                 : Kinder hören selbst — auch bevor sie lesen können
    description                           : Große, bunte Cover statt Menüs, und auf Wunsch liest Hörspieler die Titel vor. So findet dein Kind seine Lieblingsfolge ohne Hilfe.
    fontawesome_icon_name                 : child

  - title                                 : Genau da weiterhören, wo aufgehört wurde
    description                           : Hörspieler merkt sich die Stelle auf die Sekunde — und nimmt sie über deine private iCloud mit, vom iPhone aufs iPad und zurück.
    fontawesome_icon_name                 : play-circle

  - title                                 : Nichts, wo sich Kinder verirren
    description                           : Die Suche lässt sich ganz abschalten, und die Einstellungen schützt dein PIN oder eine Rechenaufgabe, die Kinder nicht lösen.
    fontawesome_icon_name                 : lock

  - title                                 : Alle Hörspiele aus deinem Apple Music
    description                           : Keine zweite Bibliothek und kein Einzelkauf von Folgen. Hörspieler spielt die Hörspiele und Hörbücher von Apple Music — du brauchst nur dein Abo.
    fontawesome_icon_name                 : music

  - title                                 : „Spiele Benjamin Blümchen“ — und es läuft
    description                           : Siri und Kurzbefehle starten Hörspiele auf Zuruf. Favoriten findest du auch direkt über die Spotlight-Suche (ab iOS 18).
    fontawesome_icon_name                 : microphone


