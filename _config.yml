# Feature List                            Edit, add or remove features to be presented.
#                                         Order matters: the first rows are the ones a parent reads.
#                                         Icons must exist in Font Awesome 5.6.3 Free (see _includes/head.html).
features                                  :

  - title                                 : Offline hören
    description                           : Kein Netz? Kein Problem. Was über Apple Music aufs Gerät geladen wurde, zeigt und spielt Hörspieler auch im Funkloch — im Auto, im Zug, im Urlaub.
    fontawesome_icon_name                 : wifi

  - title                                 : Einschlaf-Timer
    description                           : Von fünf Minuten bis zu einer Stunde, oder einfach bis zum Ende der Folge. Das Hörspiel hört von selbst auf — niemand muss mehr aufstehen.
    fontawesome_icon_name                 : moon

  - title                                 : Apple Music Anbindung
    description                           : Greife auf den größten Streaming-Katalog zu und spiele alle Hörspiele, Hörbücher und Musik im Angebot von Apple.
    fontawesome_icon_name                 : music

  - title                                 : Favoriten
    description                           : Merke dir deine Lieblingshörspiele für einen schnellen Zugriff — als große, bunte Kacheln zum Antippen.
    fontawesome_icon_name                 : heart

  - title                                 : Kinderleichte Bedienung
    description                           : Große Bedienelemente, keine Menüs, nichts zum Verirren. Auswahl der Alben mit Cover Flow oder Kachelansicht.
    fontawesome_icon_name                 : child

  - title                                 : Sprachausgabe
    description                           : Du kannst noch nicht lesen? Kein Problem! Lasse dir die Titel von Interpreten und Folgen vorlesen.
    fontawesome_icon_name                 : comment

  - title                                 : Weiterhören, wo du warst
    description                           : Hörspieler merkt sich die Wiedergabeposition der zuletzt gehörten Alben — auf die Sekunde genau.
    fontawesome_icon_name                 : play-circle

  - title                                 : CarPlay
    description                           : Weiterhören im Auto, ohne sich nach hinten umzudrehen. Zuletzt Gehörtes und Favoriten direkt auf dem Display.
    fontawesome_icon_name                 : car

  - title                                 : Auf allen Geräten synchron
    description                           : Favoriten und Wiedergabepositionen wandern über deine private iCloud mit — vom iPhone aufs iPad und zurück.
    fontawesome_icon_name                 : cloud

  - title                                 : Siri, Kurzbefehle und Spotlight
    description                           : Sag einfach „Spiele Benjamin Blümchen in Hörspieler“. Favoriten findest du auch direkt über die Spotlight-Suche (ab iOS 18).
    fontawesome_icon_name                 : microphone

  - title                                 : Elternbereich
    description                           : Passe Hörspieler an die Bedürfnisse deiner Kleinen an, z. B. durch Deaktivierung der Suchfunktion. Hinter einer kleinen Rechenaufgabe, die Kinder nicht lösen.
    fontawesome_icon_name                 : lock

  - title                                 : AirPlay und Bluetooth Unterstützung
    description                           : Du hast einen externen Lautsprecher? Großartig! Hörspieler spielt auch direkt auf die Ohren oder auf den großen Boxen.
    fontawesome_icon_name                 : bullhorn

  - title                                 : Dark und Lightmode
    description                           : Ob du tagsüber oder abends im Bett hörst, Hörspieler kleidet sich im passenden Gewand.
    fontawesome_icon_name                 : lightbulb


